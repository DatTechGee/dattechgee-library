    <script>
      // Apply saved / system theme BEFORE first paint to avoid flash.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;
          if (stored === "dark" || (!stored && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>

  <body>
    <div id="root">
      <div id="preloader" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;transition:opacity .4s ease;">
        <style>
          @keyframes preloaderSpin { to { transform: rotate(360deg); } }
          @keyframes preloaderPulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
          .dark #preloader { background: #0f1419; }
          .preloader-ring { width:48px;height:48px;border:4px solid #e5e5e5;border-top-color:#1e5ba8;border-radius:50%;animation:preloaderSpin .8s linear infinite; }
          .dark .preloader-ring { border-color: #333; border-top-color: #4D9FFF; }
          .preloader-text { margin-top:20px;font-family:Satoshi,Avenir,Helvetica,Arial,sans-serif;font-size:1.125rem;font-weight:700;letter-spacing:-.02em;color:#1e5ba8;animation:preloaderPulse 1.5s ease-in-out infinite; }
          .dark .preloader-text { color: #4D9FFF; }
        </style>
        <div class="preloader-ring"></div>
        <div class="preloader-text">DatTechGee Library</div>
      </div>
